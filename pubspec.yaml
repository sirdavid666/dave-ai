name: dave_ai
description: "DAVE AI - Your personal assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # AI BRAIN
  llama_flutter:
    git:
      url: https://github.com/fzyzcjy/flutter_llama

  # CORE PACKAGES
  battery_plus: ^5.0.2
  flutter_local_notifications: ^17.2.3
  flutter_tts: ^4.0.0
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  intl: ^0.19.0
  timezone: ^0.9.4
  workmanager: ^0.5.2
  dio: ^5.4.3
  path_provider: ^2.1.4
  url_launcher: ^6.3.1
  flutter_phone_direct_caller: ^3.0.2
  flutter_animate: ^4.5.0
  permission_handler: ^11.3.1
  webview_flutter: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
