version: 1.0.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  workmanager: ^0.5.2
  battery_plus: ^6.0.0
  permission_handler: ^12.0.0
