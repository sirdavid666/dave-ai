name: dave_ai
description: DAVE AI - Jarvis-style personal AI companion for Boss David. 100% Offline.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # CORE
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.19.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.4

  # VOICE + TTS + STT
  flutter_tts: ^3.8.5
  speech_to_text: ^6.6.2

  # TINYLLAMA BRAIN
  llama_flutter: ^0.1.2
  dio: ^5.4.3

  # PROACTIVE + NOTIFICATIONS
  workmanager: ^0.5.2
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  android_alarm_manager_plus: ^4.0.2

  # UI + ANIMATIONS
  flutter_animate: ^4.5.0
  particles_flutter: ^1.0.0
  animated_text_kit: ^4.2.2

  # ACTIONS
  battery_plus: ^6.2.0
  url_launcher: ^6.3.0
  flutter_phone_direct_caller: ^2.1.1
  contacts_service: ^0.6.3

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
