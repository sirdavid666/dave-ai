publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  flutter_local_notifications: ^17.2.3
  particles_flutter: ^1.0.4
  animated_text_kit: ^4.2.2
  battery_plus: ^6.0.2
  intl: ^0.19.0
  android_alarm_manager_plus: ^4.0.4
  permission_handler: ^11.3.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
