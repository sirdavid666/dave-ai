name: dave_ai
description: "DAVE AI - 100% Offline Personal Assistant"

publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  workmanager: ^0.5.2
  battery_plus: ^6.0.0
  permission_handler: ^12.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_tts: ^4.0.0
  speech_to_text: ^6.6.2
  flutter_local_notifications: ^18.0.1
  intl: ^0.19.0
  timezone: ^0.10.1
  webview_flutter: ^4.7.0 # NEW: To load index.html
  http: ^1.2.2 # NEW: For weather
  flutter_animate: ^4.5.0 # NEW: For pulsing mic

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets: # NEW: This loads your index.html
    - assets/index.html
