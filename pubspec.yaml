name: dave_ai
description: "DAVE AI - Your Personal Jarvis Assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
    
  # UI & Core
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  dio: ^5.5.0
  url_launcher: ^6.3.0
  
  # Permissions & Audio - NEEDED FOR DAVE TO TALK + LISTEN
  permission_handler: ^12.0.0
  record: ^5.2.1
  flutter_tts: ^4.2.3
  
  # AI - ON DEVICE BRAINS
  llama_flutter_android: ^0.1.2
  whisper_ggml: ^2.6.0
  
  # Background & Notifications
  battery_plus: ^6.1.2
  timezone: ^0.9.4
  workmanager: ^0.5.2
  flutter_local_notifications: ^18.0.1

flutter:
  uses-material-design: true
