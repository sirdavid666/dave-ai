name: dave_ai
description: "DAVE AI - Offline Jarvis Voice Assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"  # Dart 3.5+ needed for whisper 2.5.0

dependencies:
  flutter:
    sdk: flutter
  llama_flutter_android: ^0.2.6
  whisper_ggml: ^2.5.0  # THIS CAN USE YOUR LOCAL ggml-base.bin
  flutter_tts: ^4.2.3
  record: ^5.2.1
  http: ^1.2.2
  path_provider: ^2.1.5
  hive_flutter: ^1.1.0
  workmanager: ^0.5.2
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  battery_plus: ^6.2.2
  shared_preferences: ^2.5.3
  flutter_animate: ^4.5.2
  intl: ^0.19.0

flutter:
  uses-material-design: true
