version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  workmanager: ^0.5.2
  battery_plus: ^6.0.0
  permission_handler: ^12.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_tts: ^4.0.0
  speech_to_text: ^6.6.2
  flutter_local_notifications: ^18.0.1
  intl: ^0.19.0
  timezone: ^0.10.1

dependency_overrides: 
  android_alarm_manager_plus: ^5.0.0 
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
