environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.0
  workmanager: ^0.5.2
  permission_handler: ^11.3.1
  hive_flutter: ^1.1.2
  hive: ^2.2.3
  flutter_local_notifications: ^17.2.3
