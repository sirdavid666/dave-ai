name: dave_ai
description: "DAVE AI - private offline personal AI assistant"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Local AI
  llama_flutter_android: ^0.2.6
  whisper_ggml: ^2.6.0

  # Audio
  record: ^6.2.1

  # Voice
  flutter_tts: ^4.2.3

  # Storage / networking
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  dio: ^5.8.0+1

  # Device
  battery_plus: ^6.2.1
  permission_handler: ^12.0.1

  # Android actions
  url_launcher: ^6.3.1
  flutter_phone_direct_caller: ^2.1.1

  # Notifications/background
  flutter_local_notifications: ^18.0.1
  workmanager: ^0.5.2
  timezone: ^0.9.4

  # UI
  flutter_animate: ^4.5.2

  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
