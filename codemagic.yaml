workflows:
  dave-ai-android:
    name: DAVE AI Android Release

    environment:
      flutter: 3.29.3

      java: 17

      groups:
        - google_play

      vars:
        PACKAGE_NAME: "com.example.dave_ai"

    cache:
      cache_paths:
        - $HOME/.android/debug.keystore

    scripts:

      - name: Flutter doctor
        script: |
          flutter --version
          flutter doctor -v

      - name: Clean project
        script: |
          flutter clean

      - name: Get packages
        script: |
          flutter pub get

      - name: Analyze Dart
        script: |
          flutter analyze

      - name: Build release APK
        script: |
          flutter build apk \
            --release \
            --no-shrink \
            --dart-define=GEMINI_API_KEY=$GEMINI_API_KEY

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

    publishing:
      email:
        recipients:
          - "$CM_EMAIL"
