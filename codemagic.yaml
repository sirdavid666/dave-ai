workflows:
  dave-ai-android:
    name: DAVE AI Android Release

    environment:
      flutter: 3.29.3

      java: 17

      groups:
        - google_play

      vars:
        PACKAGE_NAME: "com.example.dave_ai"

    scripts:

      - name: Restore or generate permanent debug keystore
        script: |
          mkdir -p $HOME/.android
          rm -f $HOME/.android/debug.keystore
          if [ -n "$DAVE_DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DAVE_DEBUG_KEYSTORE_BASE64" | base64 -d > $HOME/.android/debug.keystore
            echo "Restored saved permanent keystore."
          else
            keytool -genkeypair -v \
              -keystore $HOME/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=DAVE AI,O=DAVE,C=NG"
            echo "===== COPY THE LINE BELOW ====="
            base64 < $HOME/.android/debug.keystore | tr -d '\n'
            echo ""
            echo "===== END ====="
          fi

      - name: Flutter doctor
        script: |
          flutter --version
          flutter doctor -v

      - name: Clean project
        script: |
          flutter clean

      - name: Get packages
        script: |
          flutter pub get

      - name: Analyze Dart
        script: |
          flutter analyze || true

      - name: Build release APK
        script: |
          flutter build apk \
            --release \
            --no-shrink \
            --dart-define=GEMINI_API_KEY=$GEMINI_API_KEY

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
