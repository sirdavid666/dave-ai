<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dave AI - Master Jarvis</title>
<style>
  body{background:#000;color:#00ff88;font-family:'Courier New', monospace;padding:10px;margin:0}
  h2{text-align:center;color:#00ff88;margin:5px 0}
  #chat{height:42vh;overflow:auto;border:2px solid #00ff88;padding:10px;margin-bottom:10px;background:#050505;border-radius:8px;font-size:14px}
  #mic{width:100%;padding:20px;background:#00ff88;border:0;color:#000;font-size:18px;border-radius:12px;font-weight:bold;cursor:pointer;transition:transform 0.15s}
  #mic:active{background:#00cc66}
  #mic.listening{animation:pulseListen 1s infinite} /* UPGRADE 3 */
  #mic.thinking{animation:pulseThink 0.8s infinite;background:#ffaa00} /* UPGRADE 3 */
  @keyframes pulseListen{
    0%{box-shadow:0 0 0 0 rgba(0,255,136,0.6)}
    70%{box-shadow:0 0 0 18px rgba(0,255,136,0)}
    100%{box-shadow:0 0 0 0 rgba(0,255,136,0)}
  }
  @keyframes pulseThink{
    0%{opacity:1}
    50%{opacity:0.55}
    100%{opacity:1}
  }
  h3{margin:10px 0 5px 0}
  #audiomack{width:100%;height:180px;border:0;border-radius:8px;background:#111}
 .error{color:#ff0044}
 .dim{color:#0a5}
</style>
</head>
<body>
<h2>DAVE AI - FOR MASTER</h2>
<div id="chat">Dave: Booting brain for Master...</div>
<button id="mic">🎤 TAP TO TALK - "Hey Dave"</button>

<h3>Music - Audiomack</h3>
<iframe id="audiomack" src="about:blank" allow="autoplay"></iframe>

<script type="module">
import * as webllm from "https://esm.run/@mlc-ai/web-llm@0.2.46";

let engine;
let isSpeaking = false;
const chat = document.getElementById('chat');
const micBtn = document.getElementById('mic');

// ====== MASTER PERSONAL SETUP ======
const MY_NAME = "Master";
const MY_TITLES = ["mr david", "boss", "master", "hey dave", "dave"];
const MY_TASKS = ["Read Bible", "Do exercise", "Eat and get ready to kick out"];
const MY_CONTACTS = {
  "dad": "+2348056710546",
  "mum": "+2348055633348",
  "mummy": "+2348055633348",
  "hermano": "+2349122362006",
  "brother": "+2349122362006",
  "sister": "+2347086930269",
  "my sister": "+2347086930269"
}
const MOTIVATION = [
  "Master, discipline is choosing between what you want now and what you want most.",
  "You don't rise to the level of your goals. You fall to the level of your systems.",
  "Read Bible, do exercise, eat, then go dominate. That's the Master way."
];
const DEFAULT_LOCATION_TEXT = "Clear skies, 31 degrees in Ibadan"; // offline fallback
// ============================================

// ====== UPGRADE 2: PERSISTENT MEMORY ======
const HISTORY_KEY = "dave_ai_history_v1";
function loadHistory(){
  try{ const raw = localStorage.getItem(HISTORY_KEY); return raw? JSON.parse(raw) : []; }
  catch(e){ return []; }
}
function saveHistory(history){
  try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(-16))); }
  catch(e){}
}
let conversationHistory = loadHistory();
for(const turn of conversationHistory){
  const who = turn.role === "user"? "You" : "Dave";
  chat.innerHTML += `<br><b>${who}:</b> ${turn.content}`;
}

// ====== SAFE SPEAK FUNCTION ======
function speak(t){
  if(isSpeaking) return;
  isSpeaking = true;
  const u = new SpeechSynthesisUtterance(t);
  u.lang='en-US'; u.rate=0.9; u.pitch=1.1;
  u.onend = ()=>{isSpeaking = false;}
  u.onerror = ()=>{isSpeaking = false;}
  speechSynthesis.speak(u);
}
function log(t){ chat.innerHTML += `<br><b>Dave:</b> ${t}`; chat.scrollTop = chat.scrollHeight; }
function logUser(t){ chat.innerHTML += `<br><b>You:</b> ${t}`; chat.scrollTop = chat.scrollHeight; }
function logError(e){ chat.innerHTML += `<br><span class="error">Dave: ${e}</span>`; chat.scrollTop = chat.scrollHeight; }

// ====== UPGRADE 5: FUZZY WAKE-WORD MATCHING ======
function levenshtein(a, b){
  const m = a.length, n = b.length;
  const dp = Array.from({length: m+1}, () => new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1]? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}
function fuzzyCalledMe(cmd){
  if(MY_TITLES.some(title => cmd.includes(title))) return true;
  const words = cmd.split(/\s+/);
  const shortWakeWords = ["dave", "boss", "master"];
  return words.some(w => shortWakeWords.some(ww => levenshtein(w, ww) <= 1)); // "a dave" will work now
}

// ====== UPGRADE 4: LIVE WEATHER + LOCATION ======
function weatherCodeToText(code){
  if(code === 0) return "clear skies";
  if([1,2,3].includes(code)) return "partly cloudy";
  if([45,48].includes(code)) return "foggy";
  if([51,53,55,61,63,65,80,81,82].includes(code)) return "rainy";
  if([95,96,99].includes(code)) return "thunderstorms";
  return "mixed conditions";
}
async function getLiveWeatherText(){
  return new Promise((resolve) => {
    if(!navigator.onLine ||!navigator.geolocation){
      resolve(DEFAULT_LOCATION_TEXT);
      return;
    }
    const timeout = setTimeout(() => resolve(DEFAULT_LOCATION_TEXT), 6000);
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        try{
          const {latitude, longitude} = pos.coords;
          const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code`;
          const res = await fetch(url);
          const data = await res.json();
          clearTimeout(timeout);
          const temp = Math.round(data.current.temperature_2m);
          const desc = weatherCodeToText(data.current.weather_code);
          resolve(`${desc}, ${temp} degrees at your location`);
        } catch(e){
          clearTimeout(timeout); resolve(DEFAULT_LOCATION_TEXT);
        }
      },
      () => { clearTimeout(timeout); resolve(DEFAULT_LOCATION_TEXT); },
      { timeout: 5000 }
    );
  });
}

// ====== UPGRADE 3: VISUAL STATE HELPERS ======
function setMicState(state){
  micBtn.classList.remove("listening", "thinking");
  if(state === "listening") micBtn.classList.add("listening");
  if(state === "thinking") micBtn.classList.add("thinking");
}

// ====== LOAD BRAIN OFFLINE ======
async function initLLM(){
  try{
    engine = await webllm.CreateMLCEngine(
      "TinyLlama-1.1B-Chat-v1.0-q4f16_1-MLC",
      { initProgressCallback: r => {
          chat.innerHTML = `Dave: Loading TinyLlama brain... ${Math.round(r.progress*100)}%`;
        }
      }
    );
    log(`Brain loaded. Good morning ${MY_NAME}. I'm online for you only.`);
    setTimeout(morningRoutine, 5000);
  } catch(e){
    logError("Brain failed to load: " + e.message);
  }
}
initLLM();

// ====== VOICE RECOGNITION ======
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if(!SR){ logError("Use Chrome browser for voice"); }
const rec = new SR();
rec.lang='en-US'; rec.continuous = false;

rec.onstart = () => setMicState("listening");

rec.onresult = async e => {
  try{
    const cmd = e.results[0][0].transcript.toLowerCase();
    logUser(cmd);
    setMicState(null);

    const calledMe = fuzzyCalledMe(cmd); // UPGRADE 5
    if(!calledMe) return;

    if(cmd.includes("call")){
      for(let name in MY_CONTACTS){
        if(cmd.includes(name)){
          window.location.href = `tel:${MY_CONTACTS[name]}`;
          speak(`Yes ${MY_NAME}, calling ${name} now.`);
          return;
        }
      }
      speak("I don't have that contact Master");
      return;
    }

    if(cmd.includes("play music")){
      if(!navigator.onLine){ speak("I need internet to play Audiomack Master"); return; }
      document.getElementById('audiomack').src = "https://audiomack.com/embed/playlist/trending";
      speak("Playing trending music for you Master");
      return;
    }
    if(cmd.includes("stop music")){
      document.getElementById('audiomack').src = "about:blank";
      speak("Music stopped Master");
      return;
    }

    if(cmd.includes("motivate")){
      speak(MOTIVATION[Math.floor(Math.random()*MOTIVATION.length)]);
      return;
    }
    if(cmd.includes("tasks")){
      speak(`${MY_NAME}, today: ${MY_TASKS.join(', ')}. Let's get it done.`);
      return;
    }

    // UPGRADE 1: STREAMING REPLIES
    if(!engine){
      speak("My brain isn't loaded yet Master");
      return;
    }

    setMicState("thinking");
    conversationHistory.push({role: "user", content: cmd});
    saveHistory(conversationHistory);

    chat.innerHTML += `<br><b>Dave:</b> <span id="streamline" class="dim">...</span>`;
    const streamEl = document.getElementById('streamline');
    let fullReply = "";

    const stream = await engine.chat.completions.create({
      messages: conversationHistory.slice(-12),
      temperature: 0.7,
      stream: true // STREAMING
    });

    for await (const chunk of stream){
      const delta = chunk.choices[0]?.delta?.content || "";
      fullReply += delta;
      if(streamEl){
        streamEl.textContent = fullReply;
        chat.scrollTop = chat.scrollHeight;
      }
    }
    streamEl.classList.remove("dim");

    conversationHistory.push({role: "assistant", content: fullReply});
    saveHistory(conversationHistory);
    setMicState(null);
    speak(fullReply);
  } catch(e){
    setMicState(null);
    logError("Command failed: " + e.message);
  }
}
rec.onerror = ()=>{ setMicState(null); logError("Mic error. Check permission."); }
rec.onend = ()=>{ setMicState(null); }
micBtn.onclick = ()=>{ try{rec.start();}catch(e){logError("Mic busy. Wait 2 seconds.");} }

// ====== PROACTIVE: DAVE TALKS BY HIMSELF ======
async function morningRoutine(){
  if(isSpeaking) return;
  const weather = await getLiveWeatherText(); // UPGRADE 4
  speak(`Good morning ${MY_NAME}. Weather today: ${weather}. Your tasks: ${MY_TASKS.join(', ')}. Time to kick out and dominate.`);
}

function proactiveCheck(){
  if(isSpeaking) return;
  const h = new Date().getHours();
  if(h === 7) morningRoutine();
  else {
    const quotes = ["Just checking in Master. Stay focused.", "You good Boss? Remember the mission.", "Mr David, greatness is calling."];
    speak(quotes[Math.floor(Math.random()*quotes.length)]);
  }
}
setInterval(proactiveCheck, 3 * 60 * 60 * 1000);
</script>
</body>
</html>
