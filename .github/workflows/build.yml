name: Build DAVE AI APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Flutter version
        run: |
          flutter --version

      - name: Flutter doctor
        run: |
          flutter doctor -v

      - name: Flutter clean
        run: |
          flutter clean

      - name: Flutter pub get
        run: |
          flutter pub get

      - name: Analyze
        run: |
          flutter analyze

      - name: Build APK
        run: |
          flutter build apk \
            --release \
            --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dave-ai-release
          path: build/app/outputs/flutter-apk/app-release.apk
