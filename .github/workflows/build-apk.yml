name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with: { distribution: 'zulu', java-version: '17' }
    - uses: subosito/flutter-action@v2
      with: { flutter-version: '3.24.5', channel: 'stable', cache: false }
    - run: flutter clean && rm -rf build ~/.pub-cache android/.gradle
    - run: flutter pub get

    - name: DIAGNOSTIC - Check for top-level build.gradle
      run: |
        echo "--- Does android/build.gradle exist? ---"
        ls -la android/build.gradle android/build.gradle.kts 2>&1 || echo "NEITHER EXISTS — THIS IS THE BUG"
        echo "--- Full android/ folder tree ---"
        find android -maxdepth 2 -type f

    - name: FIX - Create missing top-level android/build.gradle
      run: |
        if [ ! -f android/build.gradle ] && [ ! -f android/build.gradle.kts ]; then
          cat > android/build.gradle << 'EOF'
        buildscript {
            ext.kotlin_version = '1.9.22'
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.3.0'
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
            }
        }

        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }

        rootProject.buildDir = "../build"
        subprojects {
            project.buildDir = "${rootProject.buildDir}/${project.name}"
        }
        subprojects {
            project.evaluationDependsOn(":app")
        }

        tasks.register("clean", Delete) {
            delete rootProject.buildDir
        }
        EOF
          echo "Created missing android/build.gradle"
        fi

    - name: DELETE AND RECREATE MANIFEST FROM ZERO
      run: |
        rm -f android/app/src/main/AndroidManifest.xml
        printf '%s' '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:name="${applicationName}" android:label="dave_ai" android:icon="@mipmap/ic_launcher"><activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop" android:theme="@style/LaunchTheme" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode" android:hardwareAccelerated="true" android:windowSoftInputMode="adjustResize"><meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme" /><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity><meta-data android:name="flutterEmbedding" android:value="2" /></application></manifest>' > android/app/src/main/AndroidManifest.xml

    - run: flutter build apk --release --verbose 
    - uses: actions/upload-artifact@v4
      with: { name: dave-ai-apk, path: build/app/outputs/flutter-apk/app-release.apk }
