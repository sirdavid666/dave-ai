name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with: { distribution: 'zulu', java-version: '17' }

    - uses: subosito/flutter-action@v2
      with: { flutter-version: '3.24.5', channel: 'stable', cache: false }

    - run: flutter clean && rm -rf build ~/.pub-cache android/.gradle

    - run: flutter pub get

    - run: flutter build apk --release 

    - uses: actions/upload-artifact@v4
      with: { name: dave-ai-apk, path: build/app/outputs/flutter-apk/app-release.apk }
