name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter 3.24.5
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'
        cache: false

    - name: DELETE EVERYTHING
      run: |
        flutter clean
        rm -rf build
        rm -rf ~/.pub-cache
        rm -rf android/.gradle

    - name: Get dependencies
      run: flutter pub get

    - name: DEBUG - inspect manifest for hidden characters
      run: |
        echo "--- Raw bytes of AndroidManifest.xml ---"
        cat -A android/app/src/main/AndroidManifest.xml | grep -A2 -B2 flutterEmbedding

    - name: Force-write clean AndroidManifest meta-data
      run: |
        python3 -c "
        import re
        path = 'android/app/src/main/AndroidManifest.xml'
        content = open(path, encoding='utf-8').read()
        content = re.sub(r'<meta-data[^>]*android:name=.flutterEmbedding.[^>]*/>', '', content)
        content = content.replace('</application>', '    <meta-data android:name=\"flutterEmbedding\" android:value=\"2\" />\n</application>')
        open(path, 'w', encoding='utf-8').write(content)
        "
        cat android/app/src/main/AndroidManifest.xml

    - name: Build APK Release
      run: flutter build apk --release --verbose

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: dave-ai-apk
        path: build/app/outputs/flutter-apk/app-release.apk
